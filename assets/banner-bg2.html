<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}body{width:1200px;height:400px;overflow:hidden;font-family:Arial}
.b{position:relative;width:1200px;height:400px;background:linear-gradient(115deg,#3d1a8f 0%,#6a3fd6 45%,#9b6df2 75%,#c79cff 100%);overflow:hidden}
.o{position:absolute;border-radius:50%}
.g1{width:560px;height:560px;right:-180px;top:-260px;background:radial-gradient(circle,rgba(255,200,240,.45),rgba(255,200,240,0) 70%)}
.g2{width:500px;height:500px;left:-200px;bottom:-300px;background:radial-gradient(circle,rgba(255,255,255,.25),rgba(255,255,255,0) 70%)}
.ring{position:absolute;border:2px solid rgba(255,255,255,.18);border-radius:50%}
.e{position:absolute;opacity:.42;filter:drop-shadow(0 6px 14px rgba(40,10,90,.35))}
.s{position:absolute;color:#fff;opacity:.6}
.dots{position:absolute;right:40px;bottom:30px;width:180px;height:90px;background-image:radial-gradient(rgba(255,255,255,.35) 2px,transparent 2px);background-size:18px 18px}
</style></head><body><div class="b">
<div class="o g1"></div><div class="o g2"></div>
<div class="ring" style="width:340px;height:340px;right:60px;top:-120px"></div>
<div class="ring" style="width:220px;height:220px;right:-60px;top:180px"></div>
<div class="dots"></div>
<div class="e" style="right:70px;top:36px;font-size:84px;transform:rotate(-12deg)">👑</div>
<div class="e" style="right:210px;top:150px;font-size:58px;transform:rotate(10deg)">🎁</div>
<div class="e" style="right:60px;top:200px;font-size:64px;transform:rotate(14deg)">🛍️</div>
<div class="e" style="right:330px;top:40px;font-size:46px;transform:rotate(-8deg)">🚀</div>
<div class="e" style="right:360px;top:270px;font-size:40px">💜</div>
<div class="e" style="left:40px;bottom:24px;font-size:36px;transform:rotate(-10deg)">✨</div>
<div class="s" style="right:470px;top:90px;font-size:22px">✦</div>
<div class="s" style="right:180px;top:110px;font-size:16px">✦</div>
<div class="s" style="right:30px;top:150px;font-size:20px">✦</div>
<div class="s" style="left:300px;top:40px;font-size:14px">✦</div>
<div class="s" style="left:520px;bottom:40px;font-size:18px">✦</div>
</div></body></html>
